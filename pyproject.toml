# Building from source needs the pinned MLIR toolchain, which configuring
# fetches via tools/fetch-mlir-toolchain.py on supported platforms; see
# CONTRIBUTING.md.
[build-system]
requires = [
    "scikit-build-core>=0.11",
    "setuptools-scm>=9",
    "nanobind>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "cudaq-pulse"
dynamic = ["version"]
description = "Pulse-level MLIR dialect and programming model for quantum control"
readme = "README.md"
authors = [{ name = "NVIDIA Corporation" }]
# cudaq-pulse itself is Apache-2.0; the wheels statically link LLVM/MLIR
# (with the parts of LLVM's Support library under their own terms), nanobind
# and robin-map, listed in NOTICE with their license texts in LICENSES/.
license = "Apache-2.0 AND Apache-2.0 WITH LLVM-exception AND BSD-2-Clause AND BSD-3-Clause AND MIT AND Spencer-94 AND (CC0-1.0 OR Apache-2.0) AND Unicode-DFS-2015"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.12"
dependencies = ["numpy>=1.24"]
keywords = ["quantum", "pulse", "quantum control", "MLIR", "compiler", "CUDA-Q", "cuDensityMat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/NVIDIA/cudaq-pulse"
Documentation = "https://nvidia.github.io/cudaq-pulse/"
Repository = "https://github.com/NVIDIA/cudaq-pulse"
Issues = "https://github.com/NVIDIA/cudaq-pulse/issues"
Changelog = "https://github.com/NVIDIA/cudaq-pulse/releases"

[project.optional-dependencies]
# Every shared library libcudm-runtime-cuNN.so loads, transitively, except the
# driver's libcuda.so.1. cudensitymat is pre-1.0, so pin the minor we build
# against. The two sets install into the same cuquantum/ and cutensor/
# directories, so install only one of them.
cu12 = [
    "cudensitymat-cu12==0.7.*",
    "nvidia-cuda-runtime-cu12>=12.9,<13",
    "nvidia-cublas-cu12>=12.9,<13",
    "nvidia-cusolver-cu12>=11.7.5,<12",
    "nvidia-cusparse-cu12>=12.5.10,<13",
    "nvidia-curand-cu12>=10.3.10,<11",
    "nvidia-nvjitlink-cu12>=12.9,<13",
]
# CUDA 13 component wheels are not suffixed by major; cuda-toolkit pins a
# mutually consistent CUDA 13 set of them.
cu13 = [
    "cudensitymat-cu13==0.7.*",
    "cuda-toolkit[cudart,cublas,cusolver,cusparse,curand,nvjitlink]>=13.0,<14",
]
gpu = ["cudaq-pulse[cu12]"]
viz = ["matplotlib>=3.7"]

[dependency-groups]
build = [
    "cmake>=3.27",
    "ninja>=1.11",
    "nanobind>=2.12",
    "numpy>=1.24",
]
test = [
    "pytest>=8",
    "hypothesis>=6",
    "lit>=18",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    # mypy checks cudaq_pulse.viz against matplotlib's own annotations.
    "matplotlib>=3.7",
]
docs = [
    "sphinx>=7",
    "myst-parser>=3",
    "nvidia-sphinx-theme==0.0.8",
]
bench = ["matplotlib>=3.7"]
dev = [
    { include-group = "build" },
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.uv]
default-groups = ["dev"]
# `uv sync` installs tooling only. The package itself is built by CMake
# (contributor loop) or by `pip install .` (wheel); see CONTRIBUTING.md.
package = false

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
install.components = ["CudaqPulse"]
install.strip = true
wheel.packages = []
# One abi3 wheel per platform covers CPython 3.12 and newer.
wheel.py-api = "cp312"
sdist.exclude = [".cache", "build", "dist", "wheelhouse", ".github"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.scikit-build.cmake.define]
CUDAQ_PULSE_BUILD_TESTS = "OFF"
CUDAQ_PULSE_ENABLE_GPU = { env = "CUDAQ_PULSE_ENABLE_GPU", default = "OFF" }
CUDAQ_PULSE_CUDA12_ROOT = { env = "CUDAQ_PULSE_CUDA12_ROOT", default = "" }
CUDAQ_PULSE_CUDA13_ROOT = { env = "CUDAQ_PULSE_CUDA13_ROOT", default = "" }

# Only v* tags carry package versions; mlir-toolchain-* tags name toolchain
# releases.
[tool.setuptools_scm]
tag_regex = '^v(?P<version>\d+(?:\.\d+)*(?:(?:a|b|rc)\d+)?)$'

[tool.setuptools_scm.scm.git]
describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*"]

[tool.cibuildwheel]
# cp312 builds the abi3 wheel that also covers 3.13 and later.
build = ["cp312-*"]
skip = ["*-musllinux_*", "*t-*"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
build-verbosity = 1
test-extras = ["cu12"]
test-groups = ["test"]
test-sources = ["tests", "pyproject.toml", "benchmarks/compiler/compile_time.py"]
test-command = [
    "python -c \"import cudaq_pulse._build_config as c; assert sorted(c.GPU_RUNTIME_LIBRARIES) == [12, 13], 'release wheels must include the CUDA 12 and CUDA 13 GPU runtimes'\"",
    "cudaq-pulse-opt --help > /dev/null",
    "python -m pytest -m \"not gpu\"",
]

[tool.cibuildwheel.linux]
before-all = "bash tools/ci/manylinux-before-all.sh"
environment = { CUDAQ_PULSE_ENABLE_GPU = "ON", CUDAQ_PULSE_CUDA12_ROOT = "/opt/cuda12", CUDAQ_PULSE_CUDA13_ROOT = "/opt/cuda13" }
repair-wheel-command = "auditwheel repair --exclude libcudensitymat.so.0 --exclude libcudart.so.12 --exclude libcudart.so.13 -w {dest_dir} {wheel}"

# macOS wheels are compiler-only: there is no CUDA on macOS.
[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
test-extras = []
test-command = [
    "python -c \"import cudaq_pulse._build_config as c; assert not c.GPU_RUNTIME_ENABLED, 'macOS wheels must be compiler-only'\"",
    "cudaq-pulse-opt --help > /dev/null",
    "python -m pytest -m \"not gpu\"",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", ".cache"]
# Kernel DSL intrinsics: resolved while @pulse.kernel traces the body, never
# bound at module scope.
builtins = [
  "cosine", "custom", "custom_samples", "drag", "drive", "gaussian",
  "gaussian_square", "get_drive_line", "get_readout_line", "qudit_ref",
  "readout", "set_frequency", "set_phase", "shift_frequency", "shift_phase",
  "square", "sync", "tanh_ramp", "wait", "wf_add", "wf_mul", "wf_neg",
  "wf_scale", "wf_sub",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"test/**/lit*.cfg.py" = ["F821"]
# Short corpus constructors (_C, _O, ...).
"tests/workloads/bug_corpus.py" = ["N802"]
# Column-aligned report tables.
"benchmarks/**" = ["E501"]
"examples/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"

# Generated by nanobind.stubgen; its ndarray shape annotations are not PEP 484.
[[tool.mypy.overrides]]
module = "cudaq_pulse._native._cudaq_pulse_native"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "gpu: requires GPU runtime",
    "slow: long-running tests",
    "benchmark: timing guard, skipped unless --run-benchmarks is given",
    "physics: physics verification against reference values (tests/physics)",
    "nightly: slow physics check, skipped unless --run-nightly is given",
]
