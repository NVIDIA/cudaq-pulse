# A minimal controller backend, installed beside cudaq-pulse with
# `pip install examples/controller_backend`; `cudaq_pulse.backends.get("toy")`
# then finds it.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toy-controller"
version = "0.1.0"
description = "A toy controller backend for cudaq-pulse"
requires-python = ">=3.12"
dependencies = ["cudaq-pulse"]

[project.entry-points."cudaq_pulse.backends"]
toy = "toy_controller:ToyBackend"
