name: docs

# Builds the Sphinx site with warnings as errors on every pull request, and
# deploys it to GitHub Pages from main once the repository is public.

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - uses: ./.github/actions/mlir-toolchain

      - name: Build
        run: |
          uv run --no-sync cmake -S . -B build/docs -G Ninja \
            -DCUDAQ_PULSE_BUILD_DOCS=ON \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
          uv run --no-sync cmake --build build/docs --target pulse-docs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs/docs/html

  deploy:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
