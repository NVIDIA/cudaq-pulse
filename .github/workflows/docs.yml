name: docs

# Builds the Sphinx site with warnings as errors on every pull request, and
# deploys it to GitHub Pages from main, on a push or a manual run, once the
# repository is public and Pages deploys from GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which jobs the change needs (tools/ci-changes.py): the pages are built
  # for every change but one of the repository's own files (the license, the
  # contributing guide and their like), which no page reads.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.kind.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: kind
        uses: ./.github/actions/changes

  # Skipped only when the classifier succeeded and answered that the change
  # cannot reach the pages. When it failed or did not answer, the job runs
  # and its first step fails (tools/ci-ok.py), so that a skipped run of this
  # check means the pages were not needed, unless the run was cancelled.
  build:
    name: docs (build)
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs != 'false') }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The classifier succeeded and answered
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci-ok.py classifier docs
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - uses: ./.github/actions/mlir-toolchain

      - name: Build
        run: |
          uv run --no-sync cmake --preset docs
          uv run --no-sync cmake --build --preset docs

      # The in-page scripts run under Node, which the runner has: every line
      # the operations guide's waveform explorer prints must compile and play
      # its plot, the ISA tutorial's animation and gauges must place what
      # their data says, and the tutorials' animated figures must play what
      # their data says and draw their committed stills. The docs extensions
      # are tested here too, where their dependencies are installed: the
      # search of the built site must list the documented names first, and its
      # pages must hold what the extensions write into them. Without a built
      # site these tests fail here; elsewhere they are skipped.
      - name: The in-page scripts and the built site pass their tests
        env:
          PYTHONPATH: build/docs/python
          CUDAQ_PULSE_REQUIRE_NODE: "1"
          CUDAQ_PULSE_REQUIRE_DOCS_SITE: "1"
        run: >-
          uv run --no-sync python -m pytest tests/test_waveform_explorer.py tests/test_toy_flow.py
          tests/test_pulse_visual.py tests/test_docs_a11y.py tests/test_docs_api_links.py
          tests/test_docs_dialect_pages.py tests/test_docs_related_pages.py tests/test_docs_search.py
          tests/test_docs_built_html.py tests/test_api_docs.py tests/test_code_highlighting.py
          -q -p no:cacheprovider

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs/docs/html

  deploy:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages fails unless Pages is enabled with "GitHub Actions" as
      # its source (Settings, Pages); until then, warn and skip.
      - name: Check that Pages deploys from GitHub Actions
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>"$RUNNER_TEMP/pages.err")"; then
            if ! grep -q "HTTP 404" "$RUNNER_TEMP/pages.err"; then
              cat "$RUNNER_TEMP/pages.err" >&2
              exit 1
            fi
            build_type="not enabled"
          fi
          if [[ "$build_type" == "workflow" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GitHub Pages does not deploy from GitHub Actions ($build_type), so the docs were built but not deployed. Set Settings > Pages > Source to GitHub Actions."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
