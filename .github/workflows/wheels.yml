name: wheels

# Linux wheels include the GPU runtime; macOS wheels are compiler-only. Both
# are tested by cibuildwheel (see [tool.cibuildwheel] in pyproject.toml), then
# installed and tested again on clean systems without a CUDA toolkit.
# A v* tag publishes a GitHub release with the wheels and the sdist, after
# release-meta checks the tag and gpu-gate confirms GPU verification; PyPI
# uploads are disabled for now (see the end of this file).
#
# GPU gate: with the GPU_RUNNERS repository variable set, a tag runs
# gpu-install-test on the GPU runners and publishes only if it passes. Without
# runners, the tag's run stops at gpu-gate; once the GPU tests have passed on
# the tagged commit elsewhere, a maintainer runs this workflow manually on
# the tag with `gpu-verified-sha` set to that commit's full SHA (see
# CONTRIBUTING.md). A GPU run that fails cannot be overridden.

on:
  push:
    branches: [staging]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      gpu:
        description: Also run every GPU test row on the GPU runners
        type: boolean
        default: false
      gpu-verified-sha:
        description: >
          Releases without a GPU runner only: the full SHA of the tagged
          commit, confirming that the GPU tests passed on it
        type: string
        default: ""

permissions:
  contents: read

jobs:
  wheels:
    name: wheels (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos-aarch64, runner: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # On Linux the archive is unpacked inside the manylinux container by
      # tools/ci/manylinux-before-all.sh; on macOS the build runs on the host.
      - uses: ./.github/actions/mlir-toolchain
        with:
          unpack: ${{ runner.os == 'macOS' }}

      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1

      # PyPI rejects files over 100 MiB unless the project has a raised limit.
      - name: Check wheel sizes
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'EOF'
          import os, pathlib, sys
          limit_mib = 90
          rows, oversized = [], []
          for wheel in sorted(pathlib.Path("wheelhouse").glob("*.whl")):
              mib = wheel.stat().st_size / (1024 * 1024)
              rows.append(f"| `{wheel.name}` | {mib:.1f} |")
              if mib > limit_mib:
                  oversized.append(wheel.name)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Wheel sizes ({os.environ['PLATFORM']}), limit {limit_mib} MiB\n\n")
              summary.write("| wheel | MiB |\n|---|---:|\n" + "\n".join(rows) + "\n")
          print("\n".join(rows))
          for name in oversized:
              print(f"::error::{name} exceeds {limit_mib} MiB")
          sys.exit(1 if oversized or not rows else 0)
          EOF

      - name: Check wheel contents, licenses and metadata
        run: |
          python3 tools/check-wheel-contents.py wheelhouse/*.whl
          pipx run --spec 'twine>=6' twine check --strict wheelhouse/*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build --sdist
      - name: Check the sdist's licenses and metadata
        run: |
          python3 tools/check-wheel-contents.py dist/*.tar.gz
          uvx --from 'twine>=6' twine check --strict dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Installs the wheels into images that have no CUDA toolkit, the way users
  # will: rockylinux:8 is the manylinux_2_28 glibc floor, ubuntu:24.04 uses its
  # system Python, and the [cu12]/[cu13] extras must load without a GPU. The
  # 3.14t rows install the free-threaded wheel on the runner itself.
  install-test:
    name: install-test (${{ matrix.platform }}, ${{ matrix.image || matrix.runner }})
    needs: wheels
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "python:3.12-slim", python: python3 }
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "python:3.14-slim", python: python3 }
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "python:3.15-slim", python: python3 }
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "ubuntu:24.04", python: python3 }
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "rockylinux:8", python: python3.12 }
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "", python: python3.14t, python-version: "3.14t" }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "python:3.12-slim", python: python3 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "python:3.14-slim", python: python3 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "python:3.15-slim", python: python3 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "ubuntu:24.04", python: python3 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "rockylinux:8", python: python3.12 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "", python: python3.14t, python-version: "3.14t" }
          - { platform: macos-aarch64, runner: macos-15, image: "", python: python3, python-version: "3.12" }
          - { platform: macos-aarch64, runner: macos-15, image: "", python: python3, python-version: "3.14" }
          - { platform: macos-aarch64, runner: macos-15, image: "", python: python3.14t, python-version: "3.14t" }
    steps:
      - name: Install Python (ubuntu:24.04)
        if: matrix.image == 'ubuntu:24.04'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-pip python3-venv
      - name: Install Python (rockylinux:8)
        if: matrix.image == 'rockylinux:8'
        run: dnf install -y python3.12 python3.12-pip
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: matrix.python-version
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse

      - name: Install and test cudaq-pulse
        run: bash tools/ci/install-test.sh --python "${{ matrix.python }}" base

      # The pass plugin builds against the MLIR toolchain and a host compiler,
      # so only on the runners themselves.
      - uses: ./.github/actions/mlir-toolchain
        if: matrix.image == ''
        with:
          unpack: true
      - name: Load the example pass plugin into the installed cudaq-pulse-opt
        if: matrix.image == ''
        run: bash tools/ci/install-test.sh --python "${{ matrix.python }}" plugin

      - name: Install the [cu12] and [cu13] extras without a GPU
        if: runner.os == 'Linux'
        run: bash tools/ci/install-test.sh --python "${{ matrix.python }}" extras

  # The GPU tests from the wheels (gpu-tests.yml), once the GPU_RUNNERS
  # repository variable names the GPU runners: the quick rows on pushes to
  # staging, every row on release tags and on manual runs with `gpu`. Each
  # row installs one CUDA extra in an image with no CUDA toolkit, since the
  # extras supply every library. Pull requests never reach it.
  gpu-install-test:
    if: >-
      vars.GPU_RUNNERS != '' &&
      (github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v') || inputs.gpu)
    needs: wheels
    uses: ./.github/workflows/gpu-tests.yml
    with:
      source: wheels
      scope: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && 'full' || 'quick' }}

  # A release publishes only after GPU verification: gpu-install-test passed
  # in this run, or, when it did not run, a maintainer attested on a manual
  # run that the GPU tests passed on exactly this commit.
  gpu-gate:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: gpu-install-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.gpu-install-test.result }}
          EVENT: ${{ github.event_name }}
          ATTESTED_SHA: ${{ inputs.gpu-verified-sha }}
        run: |
          case "$RESULT" in
            success)
              echo "GPU verification: gpu-install-test passed on $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            skipped) ;;
            *)
              echo "::error::gpu-install-test $RESULT; a failed GPU run cannot be attested away"
              exit 1 ;;
          esac
          if [[ "$EVENT" == workflow_dispatch && "$ATTESTED_SHA" == "$GITHUB_SHA" ]]; then
            echo "::notice::GPU verification of $GITHUB_SHA attested by $GITHUB_ACTOR"
            echo "GPU verification: attested by @$GITHUB_ACTOR for $GITHUB_SHA (no GPU runner)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::no GPU verification for $GITHUB_SHA: set the GPU_RUNNERS variable, or run" \
            "this workflow on the tag with gpu-verified-sha=$GITHUB_SHA after the GPU tests pass" \
            "(CONTRIBUTING.md, Releases)"
          exit 1

  # Checks a v* tag before anything is released: it must name a PEP 440
  # version that the setuptools-scm tag_regex accepts, a final version must be
  # reachable from main, CHANGELOG.md must have its notes, and the release
  # must not exist yet.
  release-meta:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(python3 tools/release-meta.py "$TAG")"
          prerelease="$(python3 tools/release-meta.py --prerelease "$TAG")"
          if [[ "$prerelease" == false ]] &&
             ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::final release tag $TAG is not on main"
            exit 1
          fi
          python3 tools/release-notes.py "$version" > /dev/null
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; release assets are write-once"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  # Releases are GitHub-only for now: a draft is created with the notes from
  # CHANGELOG.md, every wheel and the sdist are uploaded once, their versions
  # are checked against the tag, they get signed build-provenance
  # attestations, and only then is the release published. Nothing is
  # overwritten. Verify a download with
  # `gh attestation verify <file> --repo NVIDIA/cudaq-pulse`.
  github-release:
    needs: [release-meta, wheels, sdist, install-test, gpu-gate]
    # gpu-gate runs after a skipped job, which would skip this one by default;
    # require every direct dependency to have passed instead.
    if: >-
      !cancelled() && needs.release-meta.result == 'success' &&
      needs.wheels.result == 'success' && needs.sdist.result == 'success' &&
      needs.install-test.result == 'success' && needs.gpu-gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check the artifacts' versions against the tag
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          ls -l dist
          shopt -s nullglob
          files=(dist/*.whl dist/*.tar.gz)
          (( ${#files[@]} )) || { echo "::error::no artifacts"; exit 1; }
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            [[ "$name" == "cudaq_pulse-$VERSION-"* || "$name" == "cudaq_pulse-$VERSION.tar.gz" ]] ||
              { echo "::error::$name was not built as version $VERSION"; exit 1; }
          done
      - name: Attest the build provenance of the wheels and the sdist
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Create a draft, upload once, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.release-meta.outputs.prerelease }}
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          # The history is squashed, so generated notes would be empty.
          python3 tools/release-notes.py "$VERSION" > "$RUNNER_TEMP/notes.md"
          flags=(--draft --verify-tag --title "cudaq-pulse ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md")
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}"
          gh release upload "$TAG" dist/*.tar.gz dist/*.whl
          gh release edit "$TAG" --draft=false

  # PyPI and TestPyPI uploads are disabled while releases are GitHub-only.
  # The design for re-enabling them: trusted publishing (no API tokens), one
  # job per index, each in its own protected environment (`pypi`,
  # `testpypi`) with `permissions: id-token: write` only, that `needs:`
  # release-meta and github-release, routes on
  # `needs.release-meta.outputs.prerelease` (true -> TestPyPI, false ->
  # PyPI), downloads the `wheels-*` artifacts (and the sdist once it is meant
  # for PyPI), and runs pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
  # (with `repository-url: https://test.pypi.org/legacy/` for TestPyPI) after
  # the trusted publisher is registered on the index for this repository,
  # workflow and environment.
