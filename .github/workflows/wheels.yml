name: wheels

# Linux wheels include the GPU runtime; macOS wheels are compiler-only. Both
# are tested by cibuildwheel (see [tool.cibuildwheel] in pyproject.toml), then
# installed and tested again on clean systems without a CUDA toolkit.
# A v* tag publishes a GitHub release with the wheels and the sdist, after
# release-meta checks the tag; PyPI uploads are disabled for now (see the end
# of this file).

on:
  push:
    branches: [staging]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      gpu:
        description: Also install the wheels on the GPU runner and run the GPU tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    name: wheels (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos-aarch64, runner: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # On Linux the archive is unpacked inside the manylinux container by
      # tools/ci/manylinux-before-all.sh; on macOS the build runs on the host.
      - uses: ./.github/actions/mlir-toolchain
        with:
          unpack: ${{ runner.os == 'macOS' }}

      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1

      # PyPI rejects files over 100 MiB unless the project has a raised limit.
      - name: Check wheel sizes
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'EOF'
          import os, pathlib, sys
          limit_mib = 90
          rows, oversized = [], []
          for wheel in sorted(pathlib.Path("wheelhouse").glob("*.whl")):
              mib = wheel.stat().st_size / (1024 * 1024)
              rows.append(f"| `{wheel.name}` | {mib:.1f} |")
              if mib > limit_mib:
                  oversized.append(wheel.name)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Wheel sizes ({os.environ['PLATFORM']}), limit {limit_mib} MiB\n\n")
              summary.write("| wheel | MiB |\n|---|---:|\n" + "\n".join(rows) + "\n")
          print("\n".join(rows))
          for name in oversized:
              print(f"::error::{name} exceeds {limit_mib} MiB")
          sys.exit(1 if oversized or not rows else 0)
          EOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build --sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Installs the wheels into images that have no CUDA toolkit, the way users
  # will: rockylinux:8 is the manylinux_2_28 glibc floor, ubuntu:24.04 uses its
  # system Python, and the [cu12]/[cu13] extras must load without a GPU.
  install-test:
    name: install-test (${{ matrix.platform }}, ${{ matrix.image || matrix.runner }})
    needs: wheels
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "python:3.12-slim", python: python3 }
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "python:3.14-slim", python: python3 }
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "python:3.15-slim", python: python3 }
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "ubuntu:24.04", python: python3 }
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: "rockylinux:8", python: python3.12 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "python:3.12-slim", python: python3 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "python:3.14-slim", python: python3 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "python:3.15-slim", python: python3 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "ubuntu:24.04", python: python3 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: "rockylinux:8", python: python3.12 }
          - { platform: macos-aarch64, runner: macos-14, image: "", python: python3, python-version: "3.12" }
          - { platform: macos-aarch64, runner: macos-15, image: "", python: python3, python-version: "3.14" }
    steps:
      - name: Install Python (ubuntu:24.04)
        if: matrix.image == 'ubuntu:24.04'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-pip python3-venv
      - name: Install Python (rockylinux:8)
        if: matrix.image == 'rockylinux:8'
        run: dnf install -y python3.12 python3.12-pip
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: runner.os == 'macOS'
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse

      - name: Install and test cudaq-pulse
        run: bash tools/ci/install-test.sh --python "${{ matrix.python }}" base

      - name: Install the [cu12] and [cu13] extras without a GPU
        if: runner.os == 'Linux'
        run: bash tools/ci/install-test.sh --python "${{ matrix.python }}" extras

  # Opt-in: requires a runner with an NVIDIA GPU and a driver new enough for
  # CUDA 13, selected by the GPU_RUNNER repository variable. No CUDA toolkit is
  # used; the extras supply every library. Fails if the GPU is missing.
  gpu-install-test:
    if: github.event_name == 'workflow_dispatch' && inputs.gpu
    needs: wheels
    runs-on: ${{ vars.GPU_RUNNER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-${{ runner.arch == 'ARM64' && 'linux-aarch64' || 'linux-x86_64' }}
          path: wheelhouse

      - name: Require a GPU
        run: nvidia-smi

      - name: Install [cu12] and [cu13] and run the GPU tests
        run: bash tools/ci/install-test.sh gpu

  # Checks a v* tag before anything is released: it must name a PEP 440
  # version that the setuptools-scm tag_regex accepts, a final version must be
  # reachable from main, and the release must not exist yet.
  release-meta:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(python3 tools/release-meta.py "$TAG")"
          prerelease="$(python3 tools/release-meta.py --prerelease "$TAG")"
          if [[ "$prerelease" == false ]] &&
             ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::final release tag $TAG is not on main"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; release assets are write-once"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  # Releases are GitHub-only for now: a draft is created, every wheel and the
  # sdist are uploaded once, their versions are checked against the tag, and
  # only then is the release published. Nothing is overwritten.
  github-release:
    needs: [release-meta, wheels, sdist, install-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check the artifacts' versions against the tag
        env:
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          ls -l dist
          shopt -s nullglob
          files=(dist/*.whl dist/*.tar.gz)
          (( ${#files[@]} )) || { echo "::error::no artifacts"; exit 1; }
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            [[ "$name" == "cudaq_pulse-$VERSION-"* || "$name" == "cudaq_pulse-$VERSION.tar.gz" ]] ||
              { echo "::error::$name was not built as version $VERSION"; exit 1; }
          done
      - name: Create a draft, upload once, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.release-meta.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --title "cudaq-pulse ${TAG#v}" --generate-notes)
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}"
          gh release upload "$TAG" dist/*.tar.gz dist/*.whl
          gh release edit "$TAG" --draft=false

  # PyPI and TestPyPI uploads are disabled while releases are GitHub-only.
  # The design for re-enabling them: trusted publishing (no API tokens), one
  # job per index, each in its own protected environment (`pypi`,
  # `testpypi`) with `permissions: id-token: write` only, that `needs:`
  # release-meta and github-release, routes on
  # `needs.release-meta.outputs.prerelease` (true -> TestPyPI, false ->
  # PyPI), downloads the `wheels-*` artifacts (and the sdist once it is meant
  # for PyPI), and runs pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
  # (with `repository-url: https://test.pypi.org/legacy/` for TestPyPI) after
  # the trusted publisher is registered on the index for this repository,
  # workflow and environment.
