name: ci

# A pull request reaches the GPU runners only as a pull-request/<N> branch:
# a copy of the pull request that is pushed here after a maintainer has
# vetted its commit (CONTRIBUTING.md, GPU CI). Those branches run the gpu
# job alone; the pull_request event runs every job but gpu.
on:
  push:
    branches: [main, staging, "pull-request/[0-9]+"]
  pull_request:
  workflow_dispatch:
    inputs:
      gpu:
        description: Also build with CUDAQ_PULSE_ENABLE_GPU=ON and run the GPU tests
        type: boolean
        default: false
      # Run on staging, its perf-gate-baseline artifact is the baseline to
      # commit there (python tools/perf-gate.py --help, "taking a baseline").
      perf_baseline:
        description: Run only the perf gate, with 5 identical Callgrind runs, to take its baseline
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.perf_baseline && '-perf-baseline' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (pre-commit, zizmor)
    if: ${{ !startsWith(github.ref, 'refs/heads/pull-request/') && !inputs.perf_baseline }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --only-group lint
      # The hooks run ruff (lint and format), clang-format, the license,
      # workflow-pin, release-hygiene and classical-remnant checks, and
      # zizmor offline.
      - run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
      # pre-commit runs zizmor offline; online, it also checks that every
      # pinned commit belongs to its action's repository.
      - name: zizmor (online audits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.31.1 --no-progress --min-severity medium .github

  test:
    name: test (${{ matrix.platform }}, py${{ matrix.python }})
    if: ${{ !startsWith(github.ref, 'refs/heads/pull-request/') && !inputs.perf_baseline }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Every supported interpreter: the kernel frontend decodes each
        # version's bytecode, and tests/kernel/test_ir_golden.py checks they
        # all trace to the same IR. linux-aarch64 runs the oldest and the
        # newest; macOS runs 3.12 to 3.14.
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, python: "3.12" }
          - { platform: linux-x86_64, runner: ubuntu-24.04, python: "3.13", hash-seeds: true }
          - { platform: linux-x86_64, runner: ubuntu-24.04, python: "3.14" }
          - { platform: linux-x86_64, runner: ubuntu-24.04, python: "3.15" }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, python: "3.12" }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, python: "3.15" }
          - { platform: macos-aarch64, runner: macos-15, python: "3.12" }
          - { platform: macos-aarch64, runner: macos-15, python: "3.13" }
          - { platform: macos-aarch64, runner: macos-15, python: "3.14" }
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - uses: ./.github/actions/mlir-toolchain

      - name: Configure
        run: uv run --no-sync cmake --preset dev

      # The log ends with the 30 slowest tests, to see where the time goes.
      - name: check-pulse (lit + pytest)
        env:
          PYTEST_ADDOPTS: --durations=30
        run: uv run --no-sync cmake --build build/dev --target check-pulse

      # Python randomizes str hashes in every run (PYTHONHASHSEED=random is
      # the default), but a failure that depends on the seed can't be
      # replayed without it. This leg runs the suite again under two seeds it
      # draws and logs; replay one with PYTHONHASHSEED=<seed>.
      - name: pytest under two logged hash seeds
        if: matrix.hash-seeds
        env:
          PYTHONPATH: build/dev/python
        run: |
          for seed in $(shuf -i 1-4294967295 -n 2); do
            echo "::notice title=PYTHONHASHSEED::pytest with PYTHONHASHSEED=$seed"
            if ! PYTHONHASHSEED=$seed uv run --no-sync python -m pytest tests -q -m "not gpu" -p no:cacheprovider; then
              echo "::error title=PYTHONHASHSEED::the suite failed with PYTHONHASHSEED=$seed"
              exit 1
            fi
          done

      - name: Every pass has a lit test
        run: uv run --no-sync python tools/check-pass-lit-tests.py build/dev/bin/cudaq-pulse-opt

      - name: Native exports, sizes and import time
        run: uv run --no-sync python tools/check-native-exports.py build/dev/python --max-exports 8

      - name: mypy
        run: MYPYPATH=build/dev/python uv run --no-sync mypy -p cudaq_pulse

      - name: Stubs and typed public API
        env:
          MYPYPATH: build/dev/python
          PYTHONPATH: build/dev/python
        run: |
          uv run --no-sync python -m mypy.stubtest cudaq_pulse --allowlist tools/stubtest-allowlist.txt
          uv run --no-sync mypy --strict --warn-unused-ignores tests/typing/public_api.py

      # The files a wheel installs (scikit-build installs the same component),
      # for the editor-types job.
      - name: Install the CudaqPulse component
        if: matrix.platform == 'linux-x86_64' && matrix.python == '3.12'
        run: uv run --no-sync cmake --install build/dev --component CudaqPulse --prefix installed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.platform == 'linux-x86_64' && matrix.python == '3.12'
        with:
          name: installed-linux-x86_64
          path: installed
          retention-days: 1

      # Op counts are gated by the perf-gate job and by
      # tests/classical/test_no_call_identity.py; the times are informational.
      - name: Compile-time benchmark (timing)
        run: >
          PYTHONPATH=build/dev/python uv run --no-sync python
          benchmarks/compiler/compile_time.py --iterations 5

      - name: Pipeline and QEC scaling benchmarks (smoke)
        env:
          PYTHONPATH: build/dev/python
        run: |
          uv run --no-sync python benchmarks/compiler/mlir_pipeline_bench.py --repeats 2
          uv run --no-sync python benchmarks/simulation/qec_scaling.py --distances 3 5 --repeats 1
          uv run --no-sync python benchmarks/compiler/controller_export.py --small

      # Scaling guards compare two sizes in one process, so a shared
      # runner's speed cancels out: a regression fails the job.
      - name: Perf guard (scaling and memory)
        run: >
          PYTHONPATH=build/dev/python uv run --no-sync python -m pytest
          tests/test_perf_guard.py --run-benchmarks -m scaling -q

      # Times against the checked-in baselines are noisy on shared runners;
      # a regression is reported as a warning on the run, not a failure.
      - name: Perf guard (baselines, non-blocking)
        id: perf-baselines
        continue-on-error: true
        run: >
          PYTHONPATH=build/dev/python uv run --no-sync python -m pytest
          tests/test_perf_guard.py --run-benchmarks -m "benchmark and not scaling" -q

      - name: Report a baseline perf regression
        if: steps.perf-baselines.outcome == 'failure'
        env:
          PLATFORM: ${{ matrix.platform }}
          PYTHON: ${{ matrix.python }}
        run: >
          echo "::warning title=Perf guard::tests/test_perf_guard.py is slower
          than its baseline on $PLATFORM, py$PYTHON; see the
          'Perf guard (baselines, non-blocking)' step"

  # The instructions executed by fixed compile, bind, submit, export and
  # simulate cases, counted by Callgrind, and their program sizes, against
  # benchmarks/baselines/perf_gate.json (tools/perf-gate.py). Both repeat
  # exactly between runs, so this job blocks a merge; wall-clock times stay
  # informational (the test job's perf guard). The counts also depend on the
  # toolchain, so everything is pinned: the image by digest, its packages by
  # an Ubuntu archive snapshot, uv and Python by version. Changing a pin
  # changes the counts, and the gate fails on counts from another
  # environment than the baseline's until a new baseline is taken on
  # staging. While the baseline says "bootstrap": true and has no counts,
  # the counts are reported, not gated (CONTRIBUTING.md, The perf gate). A
  # manual run with perf_baseline runs this job alone, to take a baseline.
  perf-gate:
    name: perf gate (instructions and sizes, linux-x86_64)
    if: ${{ !startsWith(github.ref, 'refs/heads/pull-request/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ubuntu:24.04@sha256:24737cef17f4e22b1977df7d9a05e77c4e28b7da5b8911f8d8ccda136bf3573c
      # Valgrind lays out the program's stack from where its own was put,
      # so the gate runs it under `setarch -R` (no address randomization),
      # which Docker's default seccomp profile refuses.
      options: --security-opt seccomp=unconfined
    env:
      UBUNTU_SNAPSHOT: 20261020T000000Z
      UV_COMPILE_BYTECODE: "1"
    steps:
      # The snapshot service needs HTTPS, so the certificates come first,
      # from the current archive; nothing measured uses them.
      - name: Install the snapshot's compiler and Valgrind
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
          apt-get update --snapshot "$UBUNTU_SNAPSHOT"
          apt-get install -y --no-install-recommends --snapshot "$UBUNTU_SNAPSHOT" \
            build-essential gh git python3 valgrind
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build reads its version from the git tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.12.15"
      - run: uv sync --locked --no-default-groups --group build
      - uses: ./.github/actions/mlir-toolchain

      - name: Build
        run: |
          uv run --no-sync cmake -S . -B build/dev -G Ninja \
            -DCUDAQ_PULSE_BUILD_TESTS=OFF \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
          uv run --no-sync cmake --build build/dev --target pulse

      # Identical Callgrind runs side by side: the summary shows how far
      # they differ (the spread) next to each case's change. A run taken as
      # the baseline makes 5, for a closer look at the spread.
      - name: Perf gate
        env:
          PROCESSES: ${{ inputs.perf_baseline && 5 || 2 }}
        run: >
          uv run --no-sync python tools/perf-gate.py --processes "$PROCESSES"
          --out perf-gate/perf_gate.json --dumps perf-gate/callgrind
          --summary "$GITHUB_STEP_SUMMARY"

      # This run's measurements in the baseline's format; the summary of a
      # failed run gives the command that makes them the baseline.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: perf-gate-baseline
          path: perf-gate/perf_gate.json
          retention-days: 14

      # Callgrind's raw dumps and Valgrind's log for each run, to inspect
      # the counts (callgrind_annotate reads them).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: perf-gate-callgrind-dumps
          path: perf-gate/callgrind
          if-no-files-found: warn
          retention-days: 14

  # Kernels type-check clean in Pylance's and Cursor's default mode and in
  # pyright's standard mode, with the package installed into a fresh
  # environment and no configuration; a typo is still reported.
  editor-types:
    name: editor types (pyright, no configuration)
    if: ${{ !startsWith(github.ref, 'refs/heads/pull-request/') && !inputs.perf_baseline }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installed-linux-x86_64
          path: installed
      - name: Fresh environment with cudaq-pulse installed
        run: |
          uv venv "$RUNNER_TEMP/user"
          uv pip install --python "$RUNNER_TEMP/user/bin/python" \
            pyright==1.1.414 "numpy>=2.0" "matplotlib>=3.9"
          site=$("$RUNNER_TEMP/user/bin/python" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          cp -R installed/. "$site/"
      - name: pyright (off and standard) over the examples and the docs
        run: >
          python3 tools/check-editor-types.py
          --python "$RUNNER_TEMP/user/bin/python"
          --pyright "$RUNNER_TEMP/user/bin/pyright"

  # Free-threaded CPython: the extension is built to run without the GIL and
  # the whole CPU suite, tests/test_threads.py included, runs with the GIL
  # off; any extension that turns it back on fails the job. wheels.yml builds
  # and tests the cp314t release wheels the same way.
  test-free-threaded:
    name: test (linux-x86_64, py3.14t)
    if: ${{ !startsWith(github.ref, 'refs/heads/pull-request/') && !inputs.perf_baseline }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONWARNINGS: "error:The global interpreter lock (GIL) has been enabled:RuntimeWarning"
      # The type checkers' tests run in the test job (tests/_tools.py).
      CUDAQ_PULSE_OPTIONAL_TOOLS: pyright,mypy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14t"
      # The lint and docs tools are checked on the GIL build.
      - run: uv sync --locked --no-default-groups --group build --group test --group bench
      - uses: ./.github/actions/mlir-toolchain

      - name: Configure and build
        run: |
          uv run --no-sync cmake -S . -B build/dev -G Ninja \
            -DCUDAQ_PULSE_BUILD_TESTS=ON \
            -DCUDAQ_PULSE_FREE_THREADED=ON \
            -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
          uv run --no-sync cmake --build build/dev

      - name: Import without enabling the GIL
        env:
          PYTHONPATH: build/dev/python
        run: >
          .venv/bin/python -c "import sys, sysconfig, cudaq_pulse;
          assert sysconfig.get_config_var('Py_GIL_DISABLED'), 'not a free-threaded interpreter';
          assert not sys._is_gil_enabled(), 'importing cudaq_pulse enabled the GIL'"

      - name: check-pulse (lit + pytest)
        env:
          PYTEST_ADDOPTS: --durations=30
        run: uv run --no-sync cmake --build build/dev --target check-pulse

  # Line and branch coverage of the Python package by the CPU suite. It is a
  # report only: there is no threshold, and the job never blocks a merge.
  # Code that runs only in a subprocess the tests start is not measured.
  coverage:
    name: coverage (report only, linux-x86_64, py3.12)
    if: ${{ !startsWith(github.ref, 'refs/heads/pull-request/') && !inputs.perf_baseline }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --group coverage
      - uses: ./.github/actions/mlir-toolchain

      - name: Build
        run: |
          uv run --no-sync cmake --preset dev
          uv run --no-sync cmake --build --preset dev

      - name: pytest under coverage
        env:
          PYTHONPATH: build/dev/python
        run: >
          uv run --no-sync coverage run --branch --source=cudaq_pulse
          -m pytest tests -q -m "not gpu" -p no:cacheprovider

      - name: Report
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync coverage xml -o coverage/coverage.xml
          uv run --no-sync coverage html -d coverage/html
          {
            echo "### Python coverage (report only, no threshold)"
            echo
            uv run --no-sync coverage report --format=markdown --sort=cover
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage
          if-no-files-found: warn
          retention-days: 14

  # A source build with GPU support and the GPU tests (gpu-tests.yml), in the
  # CUDA 12.9 development image on a GPU runner, once the GPU_RUNNERS
  # repository variable names the GPU runners: on pushes to main, staging and
  # pull-request/<N>, and on manual runs with `gpu`. The CPU suites run in
  # the jobs above. Releases are gated by gpu-install-test in wheels.yml.
  gpu:
    if: >-
      vars.GPU_RUNNERS != '' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.gpu))
    uses: ./.github/workflows/gpu-tests.yml
    with:
      source: build
