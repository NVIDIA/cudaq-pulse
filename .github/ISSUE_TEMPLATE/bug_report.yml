name: Bug report
description: Something in cudaq-pulse does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Do not report security vulnerabilities here; follow SECURITY.md
        instead. Search the existing issues before opening a new one.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: >
        The shortest kernel or script that shows the problem, with the full
        error message and traceback.
      render: python
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `python -m cudaq_pulse.doctor`
      description: >
        It reports the version, the wheel platform, the CUDA extra and the
        GPU libraries. Remove anything you consider private.
      render: text
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How cudaq-pulse was installed
      options:
        - Wheel from a GitHub release
        - Built from source (pip install . or CMake)
        - Other (describe above)
    validations:
      required: true
