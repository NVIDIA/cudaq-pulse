exclude: ^(build|\.cache)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^LICENSES/  # third-party license texts stay verbatim
      - id: trailing-whitespace
        exclude: ^LICENSES/  # third-party license texts stay verbatim

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  # Keep in step with the ruff version in uv.lock (tests/test_release_tools.py).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      # The tutorial scripts are written from the pages, as the pages show
      # the code (tools/tutorial-scripts.py).
      - id: ruff-check
        exclude: ^docs/tutorials/scripts/
      - id: ruff-format
        exclude: ^docs/tutorials/scripts/

  # Workflow security audit; ci.yml also runs its online audits.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: [--no-progress, --offline, --min-severity, medium]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: local
    hooks:
      - id: license-headers
        name: license headers
        entry: python3 tools/check-license-headers.py
        language: system
        files: \.(py|pyi|c|cpp|h|td|mlir|cmake|sh|in|txt|yml|yaml|rst|map|js|css)$|(^|/)(\.gitignore|\.clang-format|CODEOWNERS)$
        exclude: (^|/)LICENSES/  # third-party license texts stay verbatim
      - id: release-hygiene
        name: no local paths, internal hosts or credentials
        entry: python3 tools/check-release-hygiene.py
        language: system
        types: [text]
      - id: classical-remnants
        name: classical functions declared by type hints, not the old types
        entry: python3 tools/check-classical-remnants.py
        language: system
        files: \.(py|pyi|md|rst|txt|ipynb|td|h)$
      - id: removed-names
        name: docs and examples use no removed public names
        entry: python3 tools/check-removed-names.py
        language: system
        files: ^(README\.md|(docs|examples)/.*\.(py|pyi|md|rst|txt|ipynb|svg))$
      - id: workflow-pins
        name: actions and images pinned by commit or digest
        entry: python3 tools/check-workflow-pins.py
        language: system
        files: ^\.github/.*\.ya?ml$
