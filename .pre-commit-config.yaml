exclude: ^(build|\.cache)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Keep in step with the ruff version in uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: local
    hooks:
      - id: license-headers
        name: license headers
        entry: python3 tools/check-license-headers.py
        language: system
        files: \.(py|pyi|cpp|h|td|mlir|cmake|sh|in|yml|yaml)$|(^|/)CMakeLists\.txt$
      - id: workflow-pins
        name: actions and images pinned by commit or digest
        entry: python3 tools/check-workflow-pins.py
        language: system
        files: ^\.github/.*\.ya?ml$
